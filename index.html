<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Einkaufsliste">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Einkaufsliste</title>
<style>
:root{color-scheme:light;--green:#176b52;--pale:#eaf5ef;--ink:#18231e;--muted:#718078;--line:#e3eae5}
*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:620px;margin:0 auto;padding:22px 0 34px}.top{position:sticky;top:0;z-index:100;background:#f5f5f5;display:flex;align-items:center;justify-content:space-between;margin:0 -12px 20px;padding:12px;box-sizing:border-box}
h1{font-size:27px;margin:0;font-weight:800;letter-spacing:-.6px}.subtitle{color:var(--muted);font-size:13px;margin-top:5px}
  .brand{
 display:flex;
 align-items:center;
 gap:14px;
 min-width:0;
}
.lockButton{
 border:0;
 background:transparent;
 width:64px;
 height:64px;
 padding:0;
 cursor:pointer;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#263238;
 font-size:52px;
 line-height:1;
}
.lockButton svg{
 width:28px;
 height:28px;
 display:block;
}
.pill{background:var(--pale);color:var(--green);font-weight:700;padding:8px 12px;border-radius:30px;font-size:13px}
.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 3px 14px #153d2810}
form{display:flex;gap:8px}.field{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;background:#fff;color:var(--ink)}
.qty{width:75px;flex:none}.add{border:0;background:var(--green);color:white;border-radius:12px;width:48px;font-size:30px;font-weight:500}
.section{display:flex;justify-content:space-between;align-items:center;margin:19px 3px 9px;font-size:14px;font-weight:750}.hint{font-size:12px;color:var(--muted);font-weight:500}
ul{list-style:none;padding:0;margin:0}.item{display:flex;align-items:center;gap:9px;padding:11px 8px;border-bottom:1px solid #eef2ef;min-height:57px;background:#fff;border-radius:10px}.item:last-child{border-bottom:0}
.item.done .name{text-decoration:line-through;color:#9aa59e}.check{width:23px;height:23px;accent-color:var(--green);flex:none}
.name{
 flex:1;
 min-width:0;
 overflow-wrap:anywhere;
 user-select:none;
 -webkit-user-select:none;
 -webkit-touch-callout:none;
}.qtytag{color:var(--muted);font-size:13px;margin-left:5px}
.move{border:0;background:#f1f5f2;color:#4b5c52;border-radius:8px;width:32px;height:32px;font-size:16px;flex:none}.move:disabled{opacity:.25}
.handle{
 color:#9aa79f;
 font-size:20px;
 padding:0 2px;
 touch-action:none;
 cursor:grab;
 user-select:none;
 -webkit-user-select:none;
 -webkit-touch-callout:none;
 -webkit-user-drag:none;
}
.delete{border:0;background:transparent;color:#9aa59e;font-size:19px;padding:5px}
.dragging{background:#e8f3ff;box-shadow:inset 0 0 0 2px #c8def7}.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:14px}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-top:13px}
.secondary{border:1px solid var(--line);background:white;color:#53645a;border-radius:10px;padding:9px 11px;font-size:13px}
.listname{border:0;background:transparent;font:inherit;font-weight:800;color:var(--ink);max-width:180px}
.installnote{background:#fff8e8;border:1px solid #f1dfb7;border-radius:14px;padding:13px;font-size:13px;line-height:1.45;margin-top:16px;color:#66522b}
@media(min-width:500px){main{padding-top:35px}}
</style>
</head>
<body>
<main>
<div class="top">
  <div class="brand">
    <h1>🛒 Einkaufsliste</h1>
    <button id="toggleHistory" class="lockButton" aria-label="Eingekaufte anzeigen" title="Eingekaufte anzeigen">🔒</button>
  </div>
  <div class="pill" id="counter">0 / 0</div>
</div>
  <div style="display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin:-10px 0 12px">
  <button class="secondary" id="backupButton">Liste sichern</button>
  <button class="secondary" id="restoreButton">Liste wiederherstellen</button>
  <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
</div>
 <div class="panel">
  <div style="font-size:13px;font-weight:700;margin:0 0 10px 2px">Artikel hinzufügen</div>
  <form id="addForm">
  <input class="field" id="product" placeholder="Zum Beispiel Milch" autocomplete="off" required>
   <input class="field qty" id="quantity" placeholder="Menge" value="1" aria-label="Menge">
   <button class="add" aria-label="Hinzufügen">+</button>
  </form>
 </div>
 <div class="panel" style="padding:5px 9px">
  <ul id="list"></ul>
  <div class="empty" id="empty">Die Liste ist noch leer. Füge oben deinen ersten Artikel hinzu.</div>
 </div>
<div id="historyArea" hidden>
 <h3>Eingekauft</h3>
 <ul id="historyList"></ul>
 <div class="empty" id="historyEmpty">Noch nichts eingekauft.</div>
</div>
</main>
<script>
const KEY='my-basket-items-v1';
let items=[];
let showDone=false;
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
const list=document.querySelector('#list'),empty=document.querySelector('#empty');
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
  document.querySelector('#backupButton').onclick=()=>{
 const data=JSON.stringify(items,null,2);
 const blob=new Blob([data],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download='Einkaufsliste-Backup.json';
 a.click();
 URL.revokeObjectURL(url);
};
  document.querySelector('#restoreButton').onclick=()=>{
 const fileInput=document.querySelector('#restoreFile');
 fileInput.value='';
 fileInput.click();
};

document.querySelector('#restoreFile').onchange=async(e)=>{
 const file=e.target.files[0];
 if(!file)return;

 try{
  const text=await file.text();
  const imported=JSON.parse(text);

  if(!Array.isArray(imported)||imported.length===0||
     !imported.every(x=>x&&typeof x.name==='string')){
   alert('Die Sicherungsdatei ist ungültig.');
   return;
  }

  if(!confirm('Möchtest du die aktuelle Einkaufsliste wirklich durch die Sicherung ersetzen?')){
   return;
  }

  items=imported;
  save();
  showDone=false;
  render();
  alert('Die Einkaufsliste wurde wiederhergestellt.');
 }catch(err){
  alert('Die Sicherungsdatei konnte nicht gelesen werden.');
 }
};
function render(){
 const active=items.filter(x=>!x.done);
 const bought=items.filter(x=>x.done);
 const visible=showDone?items:active;
 list.innerHTML='';
 visible.forEach((it,i)=>{
  const li=document.createElement('li');
   li._item=it;
  li.className='item'+(it.done?' done':'');
  li.dataset.index=items.indexOf(it);
  const grip=document.createElement('span');
  grip.className='handle';
  grip.textContent='⋮⋮';
 const name=document.createElement('span');
name.className='name';
name.textContent=it.name;
name.style.cursor='pointer';
name.setAttribute('role','button');
name.setAttribute('tabindex','0');
name.onclick=()=>{it.done=!it.done;save();render()};
name.onkeydown=(e)=>{
 if(e.key==='Enter'||e.key===' '){
  e.preventDefault();
  it.done=!it.done;
  save();
  render();
 }
};
if(it.qty){
   const q=document.createElement('span');
   q.className='qtytag';
   q.textContent='× '+it.qty;
   name.append(q);
  }
  const edit=document.createElement('button');
  edit.className='move';
  edit.textContent='✎';
  edit.title='Menge ändern';
  edit.onclick=()=>{
   const newName=prompt('Neuen Artikelnamen eingeben:',it.name);
   if(newName===null)return;
   if(!newName.trim()){alert('Bitte einen Artikelnamen eingeben.');return;}
   const qty=prompt('Neue Menge eingeben:',it.qty||'1');
   if(qty===null)return;
   it.name=newName.trim();
   it.qty=qty.trim();
   save();
   render();
  };
   const del=document.createElement('button');
del.className='delete';
del.textContent='×';
del.title='Artikel löschen';
del.onclick=()=>{
 if(confirm('Artikel löschen?')){
  items=items.filter(x=>x!==it);
  save();
  render();
 }
};
  li.append(grip,name,edit,del);
list.append(li);
 });
 empty.style.display=visible.length?'none':'block';
 const lockButton=document.querySelector('#toggleHistory');

lockButton.title=showDone?'Eingekaufte ausblenden':'Eingekaufte anzeigen';
  lockButton.textContent=showDone?'🔓':'🔒';
lockButton.setAttribute('aria-label',lockButton.title);
document.querySelector('#historyArea').hidden=true;
 document.querySelector('#counter').textContent=`${bought.length} / ${items.length}`;
}
document.querySelector('#toggleHistory').onclick=()=>{showDone=!showDone;render()};
 function move(from,to){
 if(to<0||to>=items.length)return;
 const [x]=items.splice(from,1);
 items.splice(to,0,x);
 save();
 render();
}
document.querySelector('#addForm').addEventListener('submit',e=>{
 e.preventDefault();const name=document.querySelector('#product').value.trim();if(!name)return;
 const qty=document.querySelector('#quantity').value.trim();
 items.push({name,qty,done:false});document.querySelector('#product').value='';document.querySelector('#quantity').value='1';save();render();document.querySelector('#product').focus();
});
let draggedItem=null;
let draggedRow=null;
let pointerX=0;
let pointerY=0;
let scrollFrame=null;

function moveDragged(){
 if(!draggedItem||!draggedRow)return;

 const target=document.elementFromPoint(pointerX,pointerY)?.closest('.item');
 if(!target||target===draggedRow||!list.contains(target))return;

 const targetIndex=Number(target.dataset.index);
 const from=items.indexOf(draggedItem);
 const targetItem=items[targetIndex];
 if(!targetItem)return;

 const rect=target.getBoundingClientRect();
 const after=pointerY>rect.top+rect.height/2;
 let to=targetIndex+(after?1:0);

 items.splice(from,1);
 if(from<to)to--;
 items.splice(to,0,draggedItem);

 if(after)target.after(draggedRow);
 else target.before(draggedRow);

[...list.children].forEach(row=>{
 row.dataset.index=items.indexOf(row._item);
});
}

function autoScroll(){
 if(!draggedItem)return;

 const edge=120;
 const maxSpeed=14;
 let speed=0;

 if(pointerY<edge){
  speed=-Math.ceil((edge-pointerY)/8);
 }else if(pointerY>window.innerHeight-edge){
  speed=Math.ceil((pointerY-(window.innerHeight-edge))/8);
 }

 speed=Math.max(-maxSpeed,Math.min(maxSpeed,speed));

 if(speed!==0){
  window.scrollBy(0,speed);
  moveDragged();
 }

 scrollFrame=requestAnimationFrame(autoScroll);
}

list.addEventListener('pointerdown',e=>{
 if(!e.target.classList.contains('handle'))return;

 draggedRow=e.target.closest('.item');
 draggedItem=items[Number(draggedRow.dataset.index)];
 if(!draggedItem)return;

 draggedRow.classList.add('dragging');
  draggedRow.style.pointerEvents='none';
 pointerX=e.clientX;
 pointerY=e.clientY;

 e.target.setPointerCapture?.(e.pointerId);

 if(!scrollFrame)scrollFrame=requestAnimationFrame(autoScroll);
});

document.addEventListener('pointermove',e=>{
 if(!draggedItem)return;
 pointerX=e.clientX;
 pointerY=e.clientY;
 moveDragged();
});

document.addEventListener('pointerup',()=>{
 if(!draggedItem)return;

 draggedRow.classList.remove('dragging');
  draggedRow.style.pointerEvents='';
 draggedItem=null;
 draggedRow=null;

 if(scrollFrame){
  cancelAnimationFrame(scrollFrame);
  scrollFrame=null;
 }

 save();
 render();
});

document.addEventListener('pointercancel',()=>{
 if(!draggedItem)return;

 draggedRow.classList.remove('dragging');
  draggedRow.style.pointerEvents='';
 draggedItem=null;
 draggedRow=null;

 if(scrollFrame){
  cancelAnimationFrame(scrollFrame);
  scrollFrame=null;
 }

 save();
 render();
});
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
